services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shelfsight
      POSTGRES_PASSWORD: shelfsight   # dev only, production mein badlo
      POSTGRES_DB: shelfsight
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfsight"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        WITH_YOLO: "false"   # real model ke liye "true"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://shelfsight:shelfsight@db:5432/shelfsight
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./weights:/srv/weights:ro
      - ./uploads:/srv/uploads

volumes:
  pgdata: